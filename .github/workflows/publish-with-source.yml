name: Publish a build with its source

# Publishes the exact archives a finished build run produced, so what was tested is what ships. The
# source goes in the same release, because MariaDB is under the GPL and Redis under the AGPL.
on:
  workflow_dispatch:
    inputs:
      recipe:
        description: The component that run built
        required: true
        type: choice
        options: [mariadb, redis, valkey]
      run_id:
        description: The finished "Build a component" run to publish
        required: true
        type: string
      series:
        description: The MariaDB series that run built, such as 11.8. Other recipes ignore it
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RECIPE: ${{ inputs.recipe }}
          RUN_ID: ${{ inputs.run_id }}
          SERIES: ${{ inputs.series }}
        run: |
          source recipes/versions.env
          case "$RECIPE" in
            mariadb)
              version_var="MARIADB_${SERIES//./_}_VERSION"
              sha_var="MARIADB_${SERIES//./_}_SHA256"
              version="${!version_var:?Unknown series}"
              source_sha="${!sha_var}"
              source_url="https://archive.mariadb.org/mariadb-$version/source/mariadb-$version.tar.gz"
              title="MariaDB"
              license="MariaDB is licensed under the GPL, version 2."
              platforms="darwin-x86_64 darwin-aarch64"
              ;;
            redis)
              version="$REDIS_VERSION"
              source_sha="$REDIS_SHA256"
              source_url="$REDIS_URL"
              title="Redis"
              license="Redis is distributed here under the GNU AGPL, version 3, one of the three licenses it offers."
              platforms="darwin-x86_64 darwin-aarch64 linux-x86_64 linux-aarch64"
              ;;
            valkey)
              version="$VALKEY_VERSION"
              source_sha="$VALKEY_SHA256"
              source_url="$VALKEY_URL"
              title="Valkey"
              license="Valkey is licensed under the BSD 3-Clause license."
              platforms="darwin-x86_64 darwin-aarch64 linux-x86_64 linux-aarch64"
              ;;
          esac
          commit="$(gh run view "$RUN_ID" --json headSha --jq .headSha)"

          gh run download "$RUN_ID" --dir artifacts
          mkdir dist
          find artifacts -type f -exec mv {} dist/ \;
          count=0
          for platform in $platforms; do
            archive="$RECIPE-$version-$platform.tar.gz"
            test -f "dist/$archive"
            test "$(sha256sum "dist/$archive" | cut -d' ' -f1)" = "$(cat "dist/$archive.sha256")"
            count=$((count + 2))
          done
          test "$(find dist -type f | wc -l)" -eq "$count"

          source_file="$RECIPE-$version.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --output "dist/$source_file" "$source_url"
          echo "$source_sha  dist/$source_file" | sha256sum --check

          gh release create "$RECIPE-$version" dist/* \
            --target "$commit" \
            --latest=false \
            --title "$title $version" \
            --notes "$title $version, built by the recipes in this repository at $commit in run $RUN_ID.

          $license \`$source_file\` is the unmodified source of these builds. Licenses are inside each archive."
