name: Test PHP with separate extensions

# Phase 0 of our own PHP builds. Builds and checks inside the runner, and deliberately keeps no files.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./recipes/php-test-build.sh
      - name: Check in systems with no build tools
        run: |
          status=0
          for image in ubuntu:22.04 debian:12; do
            echo "::group::$image"
            docker run --rm --user 1000:1000 -e HOME=/tmp -e TMPDIR=/tmp \
              -v "$PWD/recipes:/check/recipes:ro" -v "$PWD/build/php-test/stage:/check/stage:ro" \
              "$image" bash /check/recipes/php-test-check.sh /check/stage || { status=1; echo "::error::$image failed"; }
            echo "::endgroup::"
          done
          # Our Nginx build needs libcrypt.so.1, which bare Fedora doesn't have. That's about Nginx, not
          # this test, so it's added here, and the Nginx recipe should stop needing it.
          echo "::group::fedora:latest"
          docker run --rm -e HOME=/tmp -e TMPDIR=/tmp \
            -v "$PWD/recipes:/check/recipes:ro" -v "$PWD/build/php-test/stage:/check/stage:ro" \
            fedora:latest bash -c 'dnf install -y -q libxcrypt-compat util-linux && setpriv --reuid=1000 --regid=1000 --clear-groups bash /check/recipes/php-test-check.sh /check/stage' \
            || { status=1; echo "::error::fedora failed"; }
          echo "::endgroup::"
          exit $status
      - name: Show the build log
        if: failure()
        run: tail -n 60 build/php-test/spc/log/* 2>/dev/null || true

  apple-silicon:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./recipes/php-test-build.sh
      - name: Check
        run: ./recipes/php-test-check.sh build/php-test/stage
      - name: Show the build log
        if: failure()
        run: tail -n 60 build/php-test/spc/log/* 2>/dev/null || true
